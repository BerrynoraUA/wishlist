packages:
  - "apps/*"
  - "packages/*"

# Required for 250 character limit in local android builds
nodeLinker: hoisted

allowBuilds:
  "@parcel/watcher": true
  core-js: true
  esbuild: true
  protobufjs: true
  re2: false
  sharp: true
  supabase: true
  tree-sitter-python: true

minimumReleaseAgeExclude:
  - "@expo/cli@57.0.3"
  - "@expo/fingerprint@0.20.1"
  - "@expo/inline-modules@0.1.1"
  - "@expo/local-build-cache-provider@57.0.1"
  - "@expo/metro-config@57.0.2"
  - "@expo/metro-runtime@57.0.2"
  - "@expo/prebuild-config@57.0.3"
  - "@expo/router-server@57.0.1"
  - babel-preset-expo@57.0.1
  - expo-asset@57.0.2
  - expo-constants@57.0.2
  - expo-dev-client@57.0.3 || 57.0.4
  - expo-dev-launcher@57.0.3 || 57.0.4
  - expo-dev-menu@57.0.3 || 57.0.4
  - expo-linking@57.0.1
  - expo-modules-autolinking@57.0.3
  - expo-modules-core@57.0.1
  - expo-notifications@57.0.2
  - expo-router@57.0.2
  - expo-splash-screen@57.0.1
  - expo-updates@57.0.4 || 57.0.5
  - expo@57.0.1
