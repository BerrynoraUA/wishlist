name: Migrate Staging DB

on:
  push:
    branches: [dev]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: # Re-run after fixing secrets or a failed push

# Never let two pushes migrate the same database at once.
concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      STAGING_PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
    steps:
      - name: Check configuration
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD STAGING_PROJECT_REF; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. See the repository's Actions secrets and variables."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to staging project
        run: supabase link --project-ref "$STAGING_PROJECT_REF"

      - name: Push migrations to staging
        run: supabase db push
