name: Native Development Build

defaults:
  tools:
    node: 22.11.0
    corepack: true
    pnpm: 11.9.0

on:
  push:
    branches:
      - dev
    paths:
      - apps/native/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.json
      - "!**/*.md"

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  validate:
    name: Validate Workspace
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Check types
        run: pnpm --dir ../.. check-types

  build_android:
    name: Build Android Development
    needs: [validate]
    type: build
    environment: development
    params:
      platform: android
      profile: development
      message: Development build from ${{ github.ref_name }}

  build_ios:
    name: Build iOS Development
    needs: [validate]
    type: build
    environment: development
    params:
      platform: ios
      profile: development
      message: Development build from ${{ github.ref_name }}

  publish_update:
    name: Publish Development Update
    needs: [build_android, build_ios]
    type: update
    environment: development
    params:
      platform: all
      channel: development
      message: Development update from ${{ github.ref_name }}
