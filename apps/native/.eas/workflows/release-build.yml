name: Native Release Build

defaults:
  tools:
    node: 22.11.0
    corepack: true
    pnpm: 11.9.0

on:
  push:
    tags:
      - native-v*

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  validate:
    name: Validate Workspace
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Check types
        run: pnpm --dir ../.. check-types

  build_android:
    name: Build Android Release
    needs: [validate]
    type: build
    environment: production
    params:
      platform: android
      profile: production
      message: Release build from ${{ github.ref_name }}

  build_ios:
    name: Build iOS Release
    needs: [validate]
    type: build
    environment: production
    params:
      platform: ios
      profile: production
      message: Release build from ${{ github.ref_name }}

  approve_store_submission:
    name: Approve Store Submission
    needs: [build_android, build_ios]
    type: require-approval

  submit_android:
    name: Submit Android Release
    needs: [build_android, approve_store_submission]
    type: submit
    environment: production
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  submit_ios:
    name: Submit iOS Release
    needs: [build_ios, approve_store_submission]
    type: submit
    environment: production
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
