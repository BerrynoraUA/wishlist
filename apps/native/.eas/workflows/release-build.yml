name: Native Release Build

defaults:
  tools:
    node: 22.14.0
    pnpm: 11.20.0

# Store submission lane, behind the approval gate. Same release train as
# production-build.yml and no git tags: `version` in app.json is part of the
# fingerprint, so bumping it is what cuts the build this lane submits. Run it
# once production-build.yml has built the version you intend to release.
#
# on:
#   workflow_dispatch:

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  build_android:
    name: Build Android Release
    type: build
    environment: production
    params:
      platform: android
      profile: production
      message: Release build from ${{ github.ref_name }}

  build_ios:
    name: Build iOS Release
    type: build
    environment: production
    params:
      platform: ios
      profile: production
      message: Release build from ${{ github.ref_name }}

  approve_store_submission:
    name: Approve Store Submission
    needs: [build_android, build_ios]
    type: require-approval

  submit_android:
    name: Submit Android Release
    needs: [build_android, approve_store_submission]
    type: submit
    environment: production
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  submit_ios:
    name: Submit iOS Release
    needs: [build_ios, approve_store_submission]
    type: submit
    environment: production
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
