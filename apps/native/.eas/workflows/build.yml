name: Native Build

defaults:
  tools:
    node: 22.14.0
    pnpm: 11.20.0

# Manual-only: workflow_dispatch never fires automatically, and the inputs
# block must stay declared for `${{ inputs.profile }}` to resolve.
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        required: true
        description: EAS build profile to use.
        default: development
        options:
          - development
          - staging
          - beta
          - production

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: ${{ inputs.profile || 'development' }}
      message: Build from ${{ github.ref_name }}

  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: ${{ inputs.profile || 'development' }}
      message: Build from ${{ github.ref_name }}
